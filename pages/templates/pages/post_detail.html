{% extends 'pages/base.html' %}
{% block content %}
  <div class="post-entry">
    <h2>{{ post.title }}</h2>
    <p>{{ post.body }}</p>
  </div>
  <a href="{% url 'pages:post-edit' post.pk %}">Edit your post</a>
  <p>
    <a href="{% url 'pages:post-delete' post.pk %}">+ Delete Blog Post</a>
  </p>
{% endblock %}
